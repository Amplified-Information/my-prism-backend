# Credentials are expanded by the NATS configuration parser from the container
# environment. The deployment must provide both values from SSM Parameter Store.
authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
  timeout: 2
}

port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 1GB
  max_file_store: 20GB
}
