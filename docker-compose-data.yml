services:
  db:
    image: ghcr.io/prismmarketlabs/db:0.1.3
    restart: always
    volumes:
      - /mnt/external/postgresdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
    environment:
      POSTGRES_USER: ${DB_UNAME}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PWORD}
  eventbus:
    image: ghcr.io/prismmarketlabs/eventbus:0.1.4
    restart: always
    ports:
      - "4222:4222"
      - "6222:6222"
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
  redis:
    image: ghcr.io/prismmarketlabs/redis:0.0.1
    restart: always
    ports:
      - "6379:6379"
