# - Ensure this repo is added to GitHub Container Registry - otherwise the push to ghcr.io will fail https://github.com/orgs/prismmarketlabs/packages
# - Ensure you have given the Role:Write for the above step (default is Read only)
# - Ensure "Workflow permissions" has "Read and write permissions" enabled https://github.com/organizations/prismmarketlabs/settings/actions

name: build/push (blocknode)

on:
  push:
    paths:
      - 'blocknode/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}           # available by default in Actions
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        # N.B.
        context: ./blocknode
        # file: # Dockerfile by default
        push: true
        tags: |
          ghcr.io/prismmarketlabs/blocknode:${{ github.sha }}
          ghcr.io/prismmarketlabs/blocknode:latest
        cache-from: type=registry,ref=ghcr.io/prismmarketlabs/blocknode:buildcache
        cache-to: type=registry,ref=ghcr.io/prismmarketlabs/blocknode:buildcache,mode=max
