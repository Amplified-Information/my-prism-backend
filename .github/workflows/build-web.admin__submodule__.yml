# - Ensure this repo is added to GitHub Container Registry - otherwise the push to ghcr.io will fail https://github.com/orgs/PrismMarketLabs/packages
# - Ensure you have given the Role:Write for the above step (default is Read only)
# - Ensure "Workflow permissions" has "Read and write permissions" enabled https://github.com/organizations/PrismMarketLabs/settings/actions

name: build/push (web.admin)

on:
  repository_dispatch:
    # This specifies the event types that will trigger the workflow.
    # In this case, the workflow will run when the 'web.admin-submodule-updated' event type occurs.
    types: [web.admin-submodule-updated]
  push:
    paths:
      - 'web.admin/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      # N.B. the with: below is required to fetch submodules:
      with:
        ref: main
        submodules: true  # Fetch submodules
        token: ${{ secrets.READ_REPO }}
    
    # additional step to pull the latest changes from all submodules, ensuring we have the latest code before building the Docker image:
    - name: Update submodules to latest commit
      run: |
        git submodule update --remote --recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}           # available by default in Actions
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        # N.B.
        context: . # can view proto files off the root
        file: ./web.admin/Dockerfile
        push: true
        tags: |
          ghcr.io/prismmarketlabs/web.admin:${{ github.sha}}
          ghcr.io/prismmarketlabs/web.admin:latest
        # no-cache: true
        cache-from: type=registry,ref=ghcr.io/prismmarketlabs/web.admin:buildcache
        cache-to: type=registry,ref=ghcr.io/prismmarketlabs/web.admin:buildcache,mode=max