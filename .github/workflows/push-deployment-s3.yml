name: push deployment files to S3

# Deployment remains manual until the staging AWS OIDC role and isolated
# deployment bucket described in docs/STAGING_V2_AWS_CHECKLIST.md exist.
on:
  workflow_dispatch:


jobs:
  upload-to-s3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # github-actions-s3-writer
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync docker-compose files to S3
        run: |
          set -x
          aws s3 cp . s3://prismlabs-deployment/ --recursive --no-follow-symlinks --exclude "*" --include "docker-compose-*"

      - name: Sync .config* and .secrets files to S3
        run: |
          # dynamically determine service names from docker-compose:
          services=$(yq '.services // {} | keys | .[]' docker-compose-*.yml 2>/dev/null | sort -u)
          for dir in $services; do
            aws s3 cp $dir s3://prismlabs-deployment/$dir/ \
              --recursive \
              --exclude "*" \
              --include ".config*" \
              --include ".secrets" \
              --include "loadEnv.sh"
          done

      - name: Sync bootstrap files to S3
        run: |
          set -x
          aws s3 cp infra s3://prismlabs-deployment/ --recursive --no-follow-symlinks --exclude "*" --include "bootstrap-*.sh"
