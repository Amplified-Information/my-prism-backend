server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # ---- Security headers (defense-in-depth) ----
    # `always` ensures the header is sent even on error responses.
    # NOTE: nginx's `add_header` is NOT inherited into nested `location`
    # blocks that define their own `add_header`, so the asset-cache block
    # below repeats these directives.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.prism.market https://*.mirrornode.hedera.com https://*.hedera.com wss://*.hedera.com https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://*.reown.com wss://*.reown.com https://*.web3modal.org https://pulse.walletconnect.org https://www.cloudflare.com https://ipapi.co; frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://*.web3modal.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # X-Robots-Tag: defense-in-depth on top of robots.txt. Empty string in
    # prod (header is omitted by nginx when value is empty), set to
    # "noindex, nofollow" in dev/uat by docker-entrypoint.sh writing a
    # snippet at /etc/nginx/conf.d/robots-tag.conf that defines
    # $robots_tag. The file always exists (entrypoint touches it).
    # Read robots_tag value from file (no set directive in included file)
    # TODO
    # include /etc/nginx/conf.d/robots-tag.conf;
    # add_header X-Robots-Tag $robots_tag always;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        # .htaccess basic auth password protection:
        include /etc/nginx/conf.d/auth.conf;
        # Serve index.html for all routes (SPA support)
        try_files $uri $uri/ /index.html;
    }

    # Static assets with cache headers — must repeat security headers because
    # add_header in this block resets inheritance from the server scope.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        ### TODO add_header X-Robots-Tag $robots_tag always;
    }
}
