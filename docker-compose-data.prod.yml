services:
  db:
    image: ghcr.io/prismmarketlabs/db:0.1.3
  eventbus:
    # Prod stays on the pre-V2 eventbus (no NATS auth) until prod switches to V2.
    image: ghcr.io/prismmarketlabs/eventbus:0.1.5
    # 0.1.5 has no monitoring endpoint for the base /healthz check; blocknode waits on it.
    healthcheck:
      test: ["CMD", "true"]
  redis:
    image: ghcr.io/prismmarketlabs/redis:0.0.1
  blocknode:
    image: ghcr.io/prismmarketlabs/blocknode:0.1.16
