syntax = "proto3";

package clob;
option go_package = "clob/gen;clob"; // Golang requires this!

import "validate/validate.proto"; // PGV

// intentionally separating public and internal services for clarity and security (espcially when using Envoy proxy)
service ClobPublic {
  rpc Health(Empty) returns (StdResponse);
  rpc GetBook (BookRequest) returns (BookSnapshot);
  rpc StreamBook (BookRequest) returns (stream BookSnapshot);
  rpc GetPrice (MarketIdRequest) returns (PriceUpdate);
  rpc StreamPrice (MarketIdRequest) returns (stream PriceUpdate);
}

service ClobInternal {
  rpc CreateOrder (CreateOrderRequestClob) returns (StdResponse);
  rpc CreateMarket (CreateMarketRequest) returns (StdResponse);
  rpc CloseMarket (MarketIdRequest) returns (StdResponse);

  rpc CancelOrder(CancelOrderRequest) returns (StdResponse);
  rpc GetOrdersForUser(UserRequest) returns (OrdersForUserResponse);
  // rpc PauseMarketToggle (MarketIdRequest) returns (StdResponse);
  // rpc DeleteMarket(MarketIdRequest) returns (StdResponse); // nuke the market on the CLOB
  rpc GetTvPendingUsd(Empty) returns (StdResponse);
  rpc GetMarketDepthQty(MarketIdRequest) returns (MarketDepthQtyResponse);
}

message Empty {}

// A PrismV2 order: the exact signed Authorization plus its cumulative fill state.
// Note: ensure there's a persistent record of all the values here - need to be able to re-create the CLOB state from these values alone
// Prices are integer YES probabilities on a 1_000_000 scale. Shares and collateral use the
// collateral token's smallest unit. Side: 0 = YES, 1 = NO. Action: 0 = BUY, 1 = SELL.
message CreateOrderRequestClob {
  reserved 5, 6, 7, 12; // V1 floating-point price/qty and primary/secondary fields
  string tx_id = 1 [json_name = "txId", (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string net = 2 [json_name = "net"];
  string market_id = 3 [json_name = "marketId"];
  string account_id = 4 [json_name = "accountId"];
  string sig = 8 [json_name = "sig"];
  string public_key = 9 [json_name = "publicKey"]; // pass key info - i) avoid lookups ii) handle situation where user has changed their key
  string evm_address = 10 [json_name = "evmAddress"]; // the authorization signer, 40 hex chars without 0x
  int32 key_type = 11 [json_name = "keyType"];
  uint64 chain_id = 13 [json_name = "chainId"];
  string verifying_contract = 14 [json_name = "verifyingContract"]; // proxy EVM address, 40 hex chars without 0x
  uint32 side = 15 [json_name = "side"];
  uint32 action = 16 [json_name = "action"];
  uint64 limit_yes_price = 17 [json_name = "limitYesPrice"];
  uint64 qty_shares = 18 [json_name = "qtyShares"];
  uint64 collateral_cap = 19 [json_name = "collateralCap"]; // only enforced for BUY orders
  uint64 deadline = 20 [json_name = "deadline"]; // unix seconds
  // Cumulative fill state. In a ClobMatch these are the values *before* that fill.
  uint64 shares_filled = 21 [json_name = "sharesFilled"];
  uint64 collateral_filled = 22 [json_name = "collateralFilled"];
}

// Published on clob.matches.settle for every fill. The bid is the YES-price buyer
// (BUY YES or SELL NO); the ask is the YES-price seller (SELL YES or BUY NO).
message ClobMatch {
  string market_id = 1 [json_name = "marketId"];
  CreateOrderRequestClob bid = 2 [json_name = "bid"];
  CreateOrderRequestClob ask = 3 [json_name = "ask"];
  uint64 fill_shares = 4 [json_name = "fillShares"];
  uint64 execution_yes_price = 5 [json_name = "executionYesPrice"];
  uint64 yes_collateral = 6 [json_name = "yesCollateral"]; // floor(fill_shares * price / 1_000_000)
  uint64 no_collateral = 7 [json_name = "noCollateral"];   // fill_shares - yes_collateral
}

message StdResponse {
  string message = 1     [json_name = "message"];
  int32 error_code = 2   [json_name = "errorCode"];
}

message BookRequest {
  string market_id = 1 [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  uint32 depth = 2     [json_name = "depth",       (validate.rules).uint32 = {gt: 0, lt: 1000}];
}

message OrderDetail {
  reserved 3, 4, 5; // V1 price_usd, qty and primary/secondary
  string tx_id = 1             [json_name = "txId"];
  string account_id = 2        [json_name = "accountId"];
  uint64 limit_yes_price = 6   [json_name = "limitYesPrice"];
  uint64 shares_remaining = 7  [json_name = "sharesRemaining"];
  uint32 side = 8              [json_name = "side"];
  uint32 action = 9            [json_name = "action"];
}

message BookSnapshot {
  repeated OrderDetail bids = 1;
  repeated OrderDetail asks = 2;
}


message CreateMarketRequest {
  string market_id = 1    [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
}

message MarketIdRequest {
  string market_id = 1    [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
}

message PriceUpdate {  // want [timestampMs[], priceUsdBid[], priceUsdAsk[]] for graphing (e.g. uplot)
  double price_bid_usd = 1    [json_name = "priceBidUsd"];
  double price_ask_usd = 2    [json_name = "priceAskUsd"];
  int64 timestamp_ms = 3      [json_name = "timestampMs"];
}

message CancelOrderRequest {
  string market_id = 1    [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string tx_id = 2        [json_name = "txId",        (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
}

message UserRequest {
  string evm_address = 1  [json_name = "evmAddress", (validate.rules).string = {pattern: "(?i)^0x[a-f0-9]{40}$"} /* Ethereum address */];
}

message OrdersForUserResponse {
  repeated CreateOrderRequestClob open_orders = 1;
}

message MarketDepthQtyResponse {
  reserved 1, 2; // V1 floating-point depth
  uint64 shares_bid = 3 [json_name = "sharesBid"];
  uint64 shares_ask = 4 [json_name = "sharesAsk"];
}
