[package]
name = "clob"
version = "0.1.0"
edition = "2024"

[dependencies]
async-nats = "0.50.0"
chrono = "0.4.42"
futures-util = "0.3.34"
log = "0.4.34"
once_cell = "1.21.3"
prost = "0.14.0"
prost-types = "0.14.0"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
tonic = "0.14.2"
# tonic-reflection = "0.8"
tonic-build = "0.14.2"
tonic-prost = "0.14.2"
# async-nats currently conflicts with time >=0.3.48 due a blanket From impl overlap.
time = "=0.3.47"
uuid = { version = "1.26.0", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14.2"

[dependencies.simple_logger]
version = "5.1.0"
default-features = false
features = ["timestamps","colors"]
