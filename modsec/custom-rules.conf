# Allow gRPC-Web content types and remove strict CRS content-type policy check.
# 920420 adds anomaly score for non-allowlisted content types; grpc-web is valid
# for this stack but not in the default CRS content-type allowlist.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^application/grpc-web(?:\+proto|-text)?(?:;.*)?$" \
    "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveById=920420"

# Belt-and-suspenders: if request targets known gRPC route prefixes, skip 920420.
SecRule REQUEST_URI "@rx ^/(api\.ApiServicePublic|api\.ApiAuth|clob\.ClobPublic)/" \
    "id:1000002,phase:1,pass,nolog,ctl:ruleRemoveById=920420"

## TODO - remove these...
# Allow Playwright-driven test traffic when it clearly identifies itself.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)\b(playwright|headlesschrome)\b" \
    "id:1000003,phase:1,pass,nolog,ctl:ruleEngine=Off"

SecRule REQUEST_HEADERS:X-Playwright-Bot "@streq 1" \
    "id:1000004,phase:1,pass,nolog,ctl:ruleEngine=Off"
