// Use lower_snake_case for field names (Google Protobuf Style Guide)
// Use json_name option for precise JSON serde - use protojson to Marshal/Unmarshal
syntax = "proto3";

package api;
option go_package = "api/gen;api";  // Golang requires this!

import "validate/validate.proto"; // PGV
// import "google/protobuf/wrappers.proto"; // this is installed in protoc include path `ls /usr/include/google/protobuf/`
// import "clob.proto";

service ApiServicePublic {
  rpc Health(Empty) returns (StdResponse);
  rpc NewsLetter(NewsLetterRequest) returns (StdResponse);
  rpc CreatePredictionIntent(PrismPredictionIntentRequest) returns (StdResponse);
  rpc GetMarketById(MarketIdRequest) returns (MarketResponse);
  rpc GetMarkets(LimitOffsetRequest) returns (MarketsResponse);  
  rpc PriceHistory(PriceHistoryRequest) returns (PriceHistoryResponse);
  rpc MacroMetadata(Empty) returns (MacroMetadataResponse); // general market data - volume, nMarkets, TVL, liquidity, etc.
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
  rpc GetUserPortfolio(UserPortfolioRequest) returns (UserPortfolioResponse);
  rpc CancelPredictionIntent(CancelOrderRequest) returns (StdResponse);

  // authenticated endpoints
  rpc CreateMarket(CreateMarketRequest) returns (CreateMarketResponse);
  rpc CreateMarketv2(CreateMarketv2Request) returns (CreateMarketResponse);
  rpc UpdateMarket(UpdateMarketRequest) returns (StdResponse);
  rpc PatchMarket(PatchMarketRequest) returns (MarketResponse);
  rpc DeleteMarket(MarketIdRequest) returns (StdResponse); // TODO
  rpc GetAllMatches(LimitOffsetRequest) returns (MatchesResponse);
  rpc GetAllPositions(LimitOffsetRequest) returns (PositionsResponse);
  rpc GetAllPredictionIntents(LimitOffsetRequest) returns (PredictionIntentsResponse);
  rpc ToggleMarketPause(MarketIdRequest) returns (StdResponse);
  rpc ToggleMarketSuspend(MarketIdRequest) returns (StdResponse);
  rpc DeleteComment(CommentIdRequest) returns (StdResponse);
  rpc ResolveMarket(ResolveMarketRequest) returns (StdResponse);
  rpc CreateCategory(CategoryRequest) returns (CategoryResponse);
  rpc UpdateCategory(CategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory(CategoryIdRequest) returns (StdResponse);
}

service ApiServiceInternal {
  // rpc endpoints go here
  rpc TriggerRecreateClob(Empty) returns (StdResponse);
  // rpc DeleteMarket(MarketIdRequest) returns (StdResponse); // systematically delete a market
}

service ApiAuth {
  rpc GetChallenge(ChallengeRequest) returns (StdResponse);
  rpc VerifyChallenge(VerifyChallengeRequest) returns (StdResponse); // pass the signature in the
}


/////
// Common
/////

message Empty {}

message StdResponse {
  string message = 1     [json_name = "message"];
  int32 error_code = 2   [json_name = "errorCode"];
}

message LimitOffsetRequest {
  int32 limit = 1  [(validate.rules).int32 = {gt: 0}];
  int32 offset = 2 [(validate.rules).int32 = {gte: 0}];
}

message MarketIdRequest {
  string market_id = 1 [json_name = "marketId",     (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  optional string lang = 2;
}

/////
// ApiServicePublic
////

message PrismPredictionIntentRequest {
  string tx_id = 1              [json_name = "txId",        (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string net = 2                [json_name = "net",         (validate.rules).string = {in: ["mainnet", "testnet", "previewnet"]} /* Hedera network */];
  string market_id = 3          [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string generated_at = 4       [json_name = "generatedAt", (validate.rules).string = {pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}Z$"} /* UTC ISO 8601 (Zulu time only) */];
  string account_id = 5         [json_name = "accountId",   (validate.rules).string = {pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"} /* Hedera account ID (no leading zeros) */];
  double price_usd = 6          [json_name = "priceUsd",    (validate.rules).double = {gt: -1.0, lt: 1.0} /* price_usd <0 => sell, price_usd >=0 => buy */];
  double qty = 7                [json_name = "qty",         (validate.rules).double = {gt: 0.0}];
  string sig = 8                [json_name = "sig",         (validate.rules).string = {pattern: "^[A-Za-z0-9+/]{20,100}={0,2}$"} /* base64-encoded signature (URL-safe base64 without padding, min 20 chars, max 100 chars) */];
  // pass extra key info - i) avoid lookups ii) handle situation where user has changed their key
  string public_key = 9         [json_name = "publicKey",   (validate.rules).string = {pattern: "^(04[0-9a-fA-F]{128}|0[23][0-9a-fA-F]{64}|[0-9a-fA-F]{64})$"} /* ECDSA (compressed/uncompressed) or Ed25519 public key in hex format, no 0x prefix */];
  string evm_address = 10       [json_name = "evmAddress",  (validate.rules).string = {pattern: "^[0-9a-fA-F]{40}$"} /* 20-byte (40 hex chars) EVM address (no 0x prefix) */];
  uint32 key_type = 11          [json_name = "keyType",     (validate.rules).uint32 = {in: [1, 2]} /* 1 = ed25519, 2 = ecdsa_secp256k1 */];
  string primary_secondary = 12 [json_name = "primarySecondary", (validate.rules).string = {in: ["p", "s"]}];
}

message Category {
  int32 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
}

message UnixDateRange {
  int32 start = 1;
  int32 end = 2;
}

message MacroMetadataResponse {
  repeated string available_networks = 1              [json_name = "availableNetworks"];
  repeated string available_networks_admin = 2        [json_name = "availableNetworksAdmin"];
  map<string, string> smart_contract_ids = 3          [json_name = "smartContractIds"];
  map<string, string> usdc_token_ids = 4              [json_name = "usdcTokenIds"];
  uint32 usdc_decimals = 5                            [json_name = "usdcDecimals"];
  uint64 market_creation_fee_scaled_usdc = 6          [json_name = "marketCreationFeeScaledUsdc"];
  uint32 n_markets = 7                                [json_name = "nMarkets"];
  map<string, string> token_ids = 8                   [json_name = "tokenIds"];
  double min_order_size_usd = 9                       [json_name = "minOrderSizeUsd"];
  double tv_pending_usd = 10                          [json_name = "tvPendingUsd"];
  double tv_matched_usd = 11                          [json_name = "tvMatchedUsd"];
  double tvl_usd = 12                                 [json_name = "tvlUsd"];
  map<string, double> total_volume_usd = 13           [json_name = "totalVolumeUsd"];
  uint32 active_traders = 14                          [json_name = "activeTraders"];
  repeated Category categories = 15                   [json_name = "categories"];
  // constants.go/SigSchemeDateRanges
  repeated UnixDateRange sig_scheme_date_ranges = 16  [json_name = "sigSchemeDateRanges"];
}

message NewsLetterRequest {
  string email = 1 [json_name = "email", (validate.rules).string = {email: true}];
}

message UserPortfolioRequest {
  string evm_address = 1           [json_name = "evmAddress",  (validate.rules).string = {pattern: "^[0-9a-fA-F]{40}$"} /* 20-byte (40 hex chars) EVM address (no 0x prefix) */];
  string net = 2                   [json_name = "net",         (validate.rules).string = {in: ["mainnet", "testnet", "previewnet"]} /* Hedera network */];
  optional string market_id = 3    [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
}

message PredictionIntentResponse {
  string tx_id = 1              [json_name = "txId",        (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string net = 2                [json_name = "net",         (validate.rules).string = {in: ["mainnet", "testnet", "previewnet"]} /* Hedera network */];
  string market_id = 3          [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string generated_at = 4       [json_name = "generatedAt", (validate.rules).string = {pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}Z$"} /* UTC ISO 8601 (Zulu time only) */];
  string account_id = 5         [json_name = "accountId",   (validate.rules).string = {pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"} /* Hedera account ID (no leading zeros) */];
  double price_usd = 6          [json_name = "priceUsd",    (validate.rules).double = {gt: -1.0, lt: 1.0} /* price_usd <0 => sell, price_usd >=0 => buy */];
  double qty = 7                [json_name = "qty",         (validate.rules).double = {gt: 0.0}];
  string primary_secondary = 8  [json_name = "primarySecondary", (validate.rules).string = {in: ["p", "s"]}];
}

message PredictionIntents {
  repeated PredictionIntentResponse prediction_intents = 1   [json_name = "openPredictionIntents"];
}

message Position {
  string market_id = 1        [json_name = "marketId"];
  string evm_address = 2      [json_name = "evmAddress"];
  uint64 yes = 3              [json_name = "yes"];
  uint64 no = 4               [json_name = "no"];
  string updated_at = 5      [json_name = "updatedAt"];
  string created_at = 6      [json_name = "createdAt"];
}

message PositionInfo {
  Position position = 1                     [json_name = "position"];
  float price_usd = 2                       [json_name = "priceUsd"];
  bool is_paused = 3                        [json_name = "isPaused"];
  string resolved_at = 4                    [json_name = "resolvedAt"];
  string redeemed_at = 5                    [json_name = "redeemedAt"];

  // Cost basis
  // P&L fields are optional so the API can distinguish "not yet backfilled" from a legitimate zero value.
  optional double avg_price_yes_usd = 6     [json_name = "avgPriceYesUsd"];   // weighted-avg entry, YES
  optional double avg_price_no_usd = 7      [json_name = "avgPriceNoUsd"];    // weighted-avg entry, NO
  optional double cost_basis_yes_usd = 8    [json_name = "costBasisYesUsd"];  // = qtyYes * avgPriceYes + unallocated fees
  optional double cost_basis_no_usd = 9     [json_name = "costBasisNoUsd"];   // = qtyNo * avgPriceNo + unallocated fees
  optional double realized_pnl_usd = 10     [json_name = "realizedPnlUsd"];   // lifetime, both sides combined for this market
  optional string cost_basis_as_of = 11     [json_name = "costBasisAsOf"];    // RFC3339 timestamp of the last fill applied
}

message PrismPoints {
  uint32 season_id = 1          [json_name = "seasonId"];
  float points = 2              [json_name = "points"];
}

message UserPortfolioResponse {
  map<string, PositionInfo> positions = 1                      [json_name = "positions"];
  map<string, PredictionIntents> open_prediction_intents = 2   [json_name = "openPredictionIntents"];
  repeated PrismPoints prism_points = 3                        [json_name = "prismPoints"];
  uint64 prism_token_balance = 4                               [json_name = "prismTokenBalance"];
}

message MarketResponse {
  string market_id = 1             [json_name = "marketId"];
  string net = 2                   [json_name = "net"];
  string statement = 3             [json_name = "statement"];
  bool is_paused = 4               [json_name = "isPaused"];
  bool is_suspended = 5            [json_name = "isSuspended"];
  string created_at = 6            [json_name = "createdAt"];
  string resolved_at = 7           [json_name = "resolvedAt"];
  string image_url = 8             [json_name = "imageUrl"];
  float price_usd = 9              [json_name = "priceUsd"];
  string description = 10          [json_name = "description"];
  string rules = 11                [json_name = "rules"];
  string closes_at = 12            [json_name = "closesAt"];
  optional int32 outcome = 13      [json_name = "outcome"]; // 0 = NO wins, 1 = YES wins, 2 = market cancelled with 50/50 payout (EmergClose5050)
  string smart_contract_id = 14    [json_name = "smartContractId"];
  repeated int32 category_ids = 15 [json_name = "categoryIds"];
  string alias_yes = 16            [json_name = "aliasYes"];
  string alias_no = 17             [json_name = "aliasNo"];
  string hex_color_yes = 18        [json_name = "hexColorYes"];
  string hex_color_no = 19         [json_name = "hexColorNo"];
  float rake_percent = 20          [json_name = "rakePercent"];
}

message MarketsResponse {
  repeated MarketResponse markets = 1;
}

message PriceHistoryRequest {
  string market_id = 1    [json_name = "marketId", (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string net = 2          [json_name = "net",      (validate.rules).string = {in: ["mainnet", "testnet", "previewnet"]} /* Hedera network */];
  string resolution = 3   [json_name = "resolution",      (validate.rules).string = {in: ["second", "minute", "hour", "day", "week", "month", "quarter", "year", "decade"]} /* zoom levels: postgres truncation */];
  string from = 4         [json_name = "from", (validate.rules).string = {pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}Z$"} /* UTC ISO 8601 (Zulu time only) */];
  string to = 5           [json_name = "to", (validate.rules).string = {pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}Z$"} /* UTC ISO 8601 (Zulu time only) */];
  optional int32 limit = 6         [json_name = "limit",     (validate.rules).int32 = {gt: 0, lte: 1000} /* max 1000 ticks per request */];
  optional int32 offset = 7        [json_name = "offset",    (validate.rules).int32 = {gte: 0} /* offset in ticks */];
}

message PriceHistoryResponse { // want [timestampMs[], priceUsd[]] for graphing (e.g. uplot)
  repeated uint64 timestamp_ms = 1   [json_name = "timestampMs"];
  repeated float price_usd = 2       [json_name = "priceUsd"];
}

message GetCommentsRequest {
  string market_id = 1      [json_name = "marketId",  (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  optional int32 limit = 2  [json_name = "limit",     (validate.rules).int32 = {gt: 0, lte: 100} /* max 100 comments per request */];
  optional int32 offset = 3 [json_name = "offset",    (validate.rules).int32 = {gte: 0} /* offset in comments */];
}

message Comment {
  // string comment_id = 1    [json_name = "commentId"];
  string account_id = 1    [json_name = "accountId"];
  string content = 2       [json_name = "content"];
  string sig = 3           [json_name = "sig"];
  string public_key = 4    [json_name = "publicKey"];
  uint32 key_type = 5      [json_name = "keyType"];
  string created_at = 6    [json_name = "createdAt"];
}

message CreateCommentResponse {
  Comment comment = 1;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
}

message CreateCommentRequest {
  string market_id = 1    [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string account_id = 2   [json_name = "accountId",   (validate.rules).string = {pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"} /* Hedera account ID (no leading zeros) */];
  string content = 3      [json_name = "content",     (validate.rules).string = {min_len: 1, max_len: 1000}];
  string sig = 4          [json_name = "sig",         (validate.rules).string = {pattern: "^[A-Za-z0-9+/]{20,100}={0,2}$"} /* base64-encoded signature (URL-safe base64 without padding, min 20 chars, max 100 chars) */];
  string public_key = 5   [json_name = "publicKey",   (validate.rules).string = {pattern: "^(04|03|02)[0-9a-fA-F]{32,256}$"} /* uncompressed (04...) or compressed (02... or 03...) public key (ed25519, ecdsa, etc.) in hex format */];
  uint32 key_type = 6     [json_name = "keyType",     (validate.rules).uint32 = {in: [1, 2]} /* 1 = ed25519, 2 = ecdsa_secp256k1 */];
}

message CancelOrderRequest {
  string market_id = 1      [json_name = "marketId",  (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string tx_id = 2          [json_name = "txId",      (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  // fields needed for sig verification:
  string net = 3            [json_name = "net",       (validate.rules).string = {in: ["mainnet", "testnet", "previewnet"]} /* Hedera network */];
  string account_id = 4     [json_name = "accountId", (validate.rules).string = {pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"} /* Hedera account ID (no leading zeros) */];
  string sig = 5            [json_name = "sig",       (validate.rules).string = {pattern: "^[A-Za-z0-9+/]{20,100}={0,2}$"} /* base64-encoded signature (URL-safe base64 without padding, min 20 chars, max 100 chars) */];
  string public_key = 6     [json_name = "publicKey", (validate.rules).string = {pattern: "^(04|03|02)[0-9a-fA-F]{32,256}$"} /* uncompressed (04...) or compressed (02... or 03...) public key (ed25519, ecdsa, etc.) in hex format */];
  uint32 key_type = 7       [json_name = "keyType",   (validate.rules).uint32 = {in: [1, 2]} /* 1 = ed25519, 2 = ecdsa_secp256k1 */];
}


/////
// ApiServicePublic - authenticated endpoints
/////

message CreateMarketRequest {
  string market_id = 1            [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string net = 2                  [json_name = "net",         (validate.rules).string = {in: ["mainnet", "testnet", "previewnet"]} /* Hedera network */];
  string statement = 3            [json_name = "statement",   (validate.rules).string = {min_len: 5, max_len: 500}];
  string image_url = 4            [json_name = "imageUrl",    (validate.rules).string = {uri: true, max_len: 2048}];
  //string smart_contract_id = 5; // not needed - smart_contract_id is added to the markets table at run-time based on the net
  optional string closes_at = 5   [json_name = "closesAt",    (validate.rules).string = {pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}Z$"} /* UTC ISO 8601 (Zulu time only) */];
  string description = 6          [json_name = "description", (validate.rules).string = {max_len: 2000}];
  string rules = 7                [json_name = "rules",       (validate.rules).string = {max_len: 2000}];
}

message CreateMarketv2Request {
  string market_id = 1            [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  string net = 2                  [json_name = "net",         (validate.rules).string = {in: ["mainnet", "testnet", "previewnet"]} /* Hedera network */];
  string statement = 3            [json_name = "statement",   (validate.rules).string = {min_len: 5, max_len: 500}];
  optional string closes_at = 4   [json_name = "closesAt",    (validate.rules).string = {pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}Z$"} /* UTC ISO 8601 (Zulu time only) */];
  string description = 5          [json_name = "description", (validate.rules).string = {max_len: 2000}];
  string rules = 6                [json_name = "rules",       (validate.rules).string = {max_len: 2000}];
  repeated int32 category_ids = 7 [json_name = "categoryIds", (validate.rules).repeated = {min_items: 1, max_items: 5}]; // a market must have at least 1 category and at most 5 categories
  
  bytes img_chunk = 8             [json_name = "imgChunk",    (validate.rules).bytes = {max_len: 5242880}]; // max 5 MB per chunk
  string img_file_name = 9        [json_name = "imgFileName", (validate.rules).string = {max_len: 255}]; // max 255 chars for file name
  string img_mime_type = 10        [json_name = "imgMimeType", (validate.rules).string = {max_len: 255, in: ["image/jpeg", "image/png", "image/gif", "image/svg+xml"]}]; // restrict to common image MIME types
  optional string alias_yes = 11          [json_name = "aliasYes",    (validate.rules).string = {min_len: 1, max_len: 100}];
  optional string alias_no = 12           [json_name = "aliasNo",     (validate.rules).string = {min_len: 1, max_len: 100}];
  optional string hex_color_yes = 13    [json_name = "hexColorYes", (validate.rules).string = {pattern: "^#[A-Fa-f0-9]{6}$"}]; // hex color code, e.g. #RRGGBB
  optional string hex_color_no = 14     [json_name = "hexColorNo",  (validate.rules).string = {pattern: "^#[A-Fa-f0-9]{6}$"}]; // hex color code, e.g. #RRGGBB
}

message CreateMarketResponse {
  MarketResponse market_response = 1  [json_name = "marketResponse"]; 
  uint64 remaining_allowance = 2      [json_name = "remainingAllowance"];
}

message UpdateMarketRequest {
  string market_id = 1            [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  repeated int32 category_ids = 6 [json_name = "categoryIds", (validate.rules).repeated = {min_items: 1, max_items: 5}]; // a market must have at least 1 category and at most 5 categories
}

message PatchMarketRequest {
  string market_id = 1                      [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  optional string closes_at = 2             [json_name = "closesAt",    (validate.rules).string = {pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}Z$"} /* UTC ISO 8601 (Zulu time only) */];
  optional string description = 3           [json_name = "description", (validate.rules).string = {max_len: 2000}];
  optional string rules = 4                 [json_name = "rules",       (validate.rules).string = {max_len: 2000}];
  optional string category_ids_str_arr = 5  [json_name = "categoryIdsStrArr", (validate.rules).string = {pattern: "^(\\d+,){0,4}\\d+$"}]; // category IDs string MUST be a comma-separated string, e.g. "1,3,5". Max 5 categories in the array.
  optional bytes img_chunk = 6              [json_name = "imgChunk",    (validate.rules).bytes = {max_len: 5242880}]; // max 5 MB per chunk
  optional string img_file_name = 7         [json_name = "imgFileName", (validate.rules).string = {max_len: 255}]; // max 255 chars for file name
  optional string img_mime_type = 8         [json_name = "imgMimeType", (validate.rules).string = {max_len: 255, in: ["image/jpeg", "image/png", "image/gif", "image/svg+xml"]}]; // restrict to common image MIME types
  optional string alias_yes = 9             [json_name = "aliasYes",    (validate.rules).string = {min_len: 1, max_len: 100}];
  optional string alias_no = 10              [json_name = "aliasNo",     (validate.rules).string = {min_len: 1, max_len: 100}];
  optional string hex_color_yes = 11        [json_name = "hexColorYes", (validate.rules).string = {pattern: "^#[A-Fa-f0-9]{6}$"}]; // hex color code, e.g. #RRGGBB
  optional string hex_color_no = 12         [json_name = "hexColorNo",  (validate.rules).string = {pattern: "^#[A-Fa-f0-9]{6}$"}]; // hex color code, e.g. #RRGGBB
}

message Match {
  string market_id = 1       [json_name = "marketId"];
  string tx_id1 = 2          [json_name = "txId1"];
  string tx_id2 = 3          [json_name = "txId2"];
  double price_usd = 5       [json_name = "priceUsd"];
  double qty1 = 6            [json_name = "qty1"];
  double qty2 = 7            [json_name = "qty2"];
  string created_at = 8      [json_name = "matchedAt"];
  string tx_hash = 9         [json_name = "txHash"];
}

message MatchesResponse {
  repeated Match matches = 1;
}

message PositionsResponse {
  repeated Position positions = 1;
}

message PredictionIntentsResponse {
  repeated PrismPredictionIntentRequest /* PIRequest for now*/ prediction_intents = 1;
}

message CommentIdRequest {
  int32 comment_id = 1 [json_name = "commentId"];
}

message ResolveMarketRequest {
  string market_id = 1      [json_name = "marketId",    (validate.rules).string = {pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"} /* Strict RFC-9562-compliant UUIDv7 */];
  int32 outcome = 2         [json_name = "outcome",     (validate.rules).int32 = {in: [0, 1, 2]} /* 0 = NO wins, 1 = YES wins, 2 = market cancelled with 50/50 payout (EmergClose5050) */];
}

message CategoryRequest {
  optional int32 category_id = 1  [json_name = "categoryId"];
  string name = 2                 [json_name = "name", (validate.rules).string = {min_len: 1, max_len: 100}];
  bool is_active = 3              [json_name = "isActive"];
  string description = 4          [json_name = "description", (validate.rules).string = {max_len: 500}];
}

message CategoryResponse {
  int32 id = 1            [json_name = "id"];
  string name = 2         [json_name = "name"];
  bool is_active = 3      [json_name = "isActive"];
  string description = 4  [json_name = "description"];
}

message CategoryIdRequest {
  int32 category_id = 1    [json_name = "categoryId"];
}

/////
// ApiAuth
/////
message ChallengeRequest {
  string account_id = 1   [json_name = "accountId",   (validate.rules).string = {pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"} /* Hedera account ID (no leading zeros) */];
  string network = 2      [json_name = "network",     (validate.rules).string = {in: ["mainnet", "testnet", "previewnet"]} /* Hedera network */];
}

message VerifyChallengeRequest {
  string challenge_response_base64 = 1   [json_name = "challengeResponseBase64", (validate.rules).string = {pattern: "^[A-Za-z0-9+/=]{10,}$"}]; // base64 chars only, min 10 chars
  // string public_key = 2                  [json_name = "publicKey",         (validate.rules).string = {pattern: "^(04|03|02)[0-9a-fA-F]{32,256}$"} /* uncompressed (04...) or compressed (02... or 03...) public key (ed25519, ecdsa, etc.) in hex format */];
  // uint32 key_type = 3                    [json_name = "keyType",           (validate.rules).uint32 = {in: [1, 2]} /* 1 = ed25519, 2 = ecdsa_secp256k1 */];
  string payload = 2                     [json_name = "payload",           (validate.rules).string = {min_len: 5, max_len: 256}]; // min 5 chars, max 256 chars
  ChallengeRequest challenge_request = 3 [json_name = "challengeRequest"]; // echo back the original challenge request for correlation
}
